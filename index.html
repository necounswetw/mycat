<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>자기소개</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    h1 {
      color: #333;
    }
    p {
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>안녕하세요!</h1>
    <img src="./zazu.jpeg" alt="내가좋아하느사진진">
    
    <p><strong>이름:</strong> <strong>안하빈빈</strong></p> <!-- 볼드체 포함 -->
    
    <p>
      저는 웹 디자인 좋아하는사람입니다. 
      위 사진은 제가 좋아하는 고양이입니다 <!-- 일반 텍스트 -->
    </p>
  </div>
</body>
</html>
